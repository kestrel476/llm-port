[project]
name = "llmport"
version = "0.1.0"
description = "Контракт, адаптеры и поведения для подключения к языковым моделям"
requires-python = ">=3.12"
# Зависимостей нет намеренно: пакет подключается в четырнадцать сервисов, и любая
# зависимость здесь становится их общей проблемой совместимости версий. HTTP-клиент
# сервис передаёт свой — он у него уже есть.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmport"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "TID", "PTH", "ARG", "PL", "TRY", "BLE", "A", "ISC", "PIE", "RET", "SLF"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR0913", "TRY003", "TRY300", "TRY301"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
